<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منظومة إحصائيات الأدوية والمستلزمات الطبية</title>
    <style>
      /* ════════════════════════════════════════════════════════════════
         SPLASH SCREEN — Pure CSS, zero JS dependencies.
         Shown immediately, hidden by React once the app has mounted.
         ════════════════════════════════════════════════════════════════ */
      @keyframes splashFadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes splashPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50%      { transform: scale(1.08); opacity: 0.85; }
      }
      @keyframes splashBar {
        0%   { width: 0%; }
        20%  { width: 22%; }
        40%  { width: 45%; }
        60%  { width: 68%; }
        80%  { width: 85%; }
        100% { width: 100%; }
      }
      @keyframes splashGlow {
        0%, 100% { text-shadow: 0 0 20px rgba(8,145,178,0.3); }
        50%      { text-shadow: 0 0 40px rgba(8,145,178,0.6), 0 0 80px rgba(8,145,178,0.2); }
      }
      @keyframes splashPills {
        0%   { transform: rotate(0deg) scale(1); }
        25%  { transform: rotate(-8deg) scale(1.05); }
        75%  { transform: rotate(8deg) scale(1.05); }
        100% { transform: rotate(0deg) scale(1); }
      }
      @keyframes splashDot1 { 0%,100% { opacity: 0.3; } 33% { opacity: 1; } }
      @keyframes splashDot2 { 0%,100% { opacity: 0.3; } 33% { opacity: 0.3; } 66% { opacity: 1; } }
      @keyframes splashDot3 { 0%,100% { opacity: 0.3; } 66% { opacity: 0.3; } 100% { opacity: 1; } }
      @keyframes splashFloat {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-6px); }
      }

      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0c1929 0%, #0f172a 30%, #1a2332 70%, #0f172a 100%);
        animation: splashFadeIn 0.6s ease-out;
        transition: opacity 0.5s ease, transform 0.5s ease;
        font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        direction: rtl;
      }
      #splash-screen.hidden {
        opacity: 0;
        transform: scale(1.05);
        pointer-events: none;
      }

      /* ── Logo ──────────────────────────────────────────────────── */
      .splash-logo {
        width: 80px;
        height: 80px;
        margin-bottom: 16px;
        animation: splashPills 2.5s ease-in-out infinite, splashFloat 3s ease-in-out infinite;
        filter: drop-shadow(0 8px 32px rgba(8,145,178,0.35));
        user-select: none;
        border-radius: 16px;
        background: white;
        padding: 8px;
        object-fit: contain;
      }

      /* ── Title ───────────────────────────────────────────────────── */
      .splash-title {
        font-size: 28px;
        font-weight: 900;
        color: #e2e8f0;
        animation: splashGlow 2.5s ease-in-out infinite;
        margin-bottom: 4px;
        letter-spacing: 0.5px;
        user-select: none;
      }
      .splash-subtitle {
        font-size: 13px;
        font-weight: 600;
        color: #64748b;
        margin-bottom: 32px;
        letter-spacing: 0.3px;
        user-select: none;
      }

      /* ── Loading bar ─────────────────────────────────────────────── */
      .splash-bar-track {
        width: 280px;
        height: 4px;
        background: rgba(148,163,184,0.12);
        border-radius: 99px;
        overflow: hidden;
        margin-bottom: 16px;
      }
      .splash-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #06b6d4, #0891b2, #0e7490);
        border-radius: 99px;
        animation: splashBar 8s ease-in-out infinite;
        box-shadow: 0 0 16px rgba(8,145,178,0.4);
      }

      /* ── Status text ─────────────────────────────────────────────── */
      .splash-status {
        font-size: 12px;
        font-weight: 600;
        color: #94a3b8;
        min-height: 22px;
        transition: opacity 0.3s ease;
        user-select: none;
      }
      .splash-status .dots span {
        display: inline-block;
        animation-duration: 1.4s;
        animation-iteration-count: infinite;
      }
      .splash-status .dots span:nth-child(1) { animation-name: splashDot1; }
      .splash-status .dots span:nth-child(2) { animation-name: splashDot2; }
      .splash-status .dots span:nth-child(3) { animation-name: splashDot3; }

      /* ── Footer ──────────────────────────────────────────────────── */
      .splash-footer {
        position: fixed;
        bottom: 20px;
        font-size: 10px;
        font-weight: 600;
        color: #334155;
        user-select: none;
        text-align: center;
        line-height: 1.6;
      }

      /* ── Responsive ──────────────────────────────────────────────── */
      @media (max-width: 480px) {
        .splash-logo { width: 60px; height: 60px; }
        .splash-title { font-size: 22px; }
        .splash-bar-track { width: 220px; }
      }
    </style>
  </head>
  <body>
    <!-- ═══ SPLASH SCREEN ═══ -->
    <div id="splash-screen">
      <img src="/logo.png" alt="شعار الهيئة العامة للتأمين الصحي" class="splash-logo" />
      <h1 class="splash-title">منظومة إحصائيات الأدوية</h1>
      <p class="splash-subtitle">الهيئة العامة للتأمين الصحي</p>
      <div class="splash-bar-track">
        <div class="splash-bar-fill" id="splash-bar"></div>
      </div>
      <p class="splash-status" id="splash-status">
        جاري تحميل التطبيق<span class="dots"><span>.</span><span>.</span><span>.</span></span>
      </p>
      <div class="splash-footer">
        تصميم وإعداد وتطوير ك/ أحمد علي أحمد كوكب<br />
        جميع الحقوق محفوظة © 2026
      </div>
    </div>

    <!-- ═══ REACT ROOT ═══ -->
    <div id="root"></div>

    <!-- ═══ Tauri Event Listener (loaded early, before React) ═══ -->
    <script>
      (function() {
        // ── DOM refs ─────────────────────────────────────────────
        var statusEl = document.getElementById('splash-status');
        var barEl   = document.getElementById('splash-bar');

        // ── Status messages (cycling through setup stages) ────────
        var statuses = {
          'init-db':     'جاري تهيئة قاعدة البيانات...',
          'schema':      'تطبيق هيكل قاعدة البيانات...',
          'migrations':  'تحديث جداول البيانات...',
          'signatures':  'تجهيز التوقيعات الرقمية...',
          'presets':     'تحميل الإعدادات المفضلة...',
          'window':      'تجهيز واجهة التطبيق...',
          'done':        'تم التحميل بنجاح ✓',
        };

        var currentStatus = '';

        function setStatus(key) {
          var msg = statuses[key] || key;
          if (msg === currentStatus) return;
          currentStatus = msg;
          if (statusEl) {
            // Smoothly swap text
            statusEl.style.opacity = '0';
            setTimeout(function() {
              statusEl.textContent = msg;
              statusEl.style.opacity = '1';
            }, 150);
          }
        }

        function hideSplash() {
          var splash = document.getElementById('splash-screen');
          if (splash) {
            splash.classList.add('hidden');
            // Remove from DOM after animation completes
            setTimeout(function() {
              if (splash.parentNode) splash.parentNode.removeChild(splash);
            }, 600);
          }
        }

        // ── Listen for Tauri events ──────────────────────────────
        if (window.__TAURI__ && window.__TAURI__.event) {
          try {
            window.__TAURI__.event.listen('splash:progress', function(e) {
              var payload = e.payload;
              if (typeof payload === 'string') {
                setStatus(payload);
              } else if (payload && payload.message) {
                setStatus(payload.message);
              }
            });

            window.__TAURI__.event.listen('splash:complete', function() {
              setStatus('done');
              setTimeout(hideSplash, 400);
            });
          } catch(e) {
            // Tauri event system not ready — fall through to auto-hide
            console.warn('Splash event listener error:', e);
          }
        }

        // ── Fallback: auto-hide after 10s in non-Tauri mode ──────
        var isTauri = typeof window !== 'undefined' &&
          (window.__TAURI__ || window.__TAURI_INTERNALS__);

        if (!isTauri) {
          // Browser dev mode — cycle statuses then auto-hide
          var fallbackMsgs = ['init-db', 'schema', 'migrations', 'signatures', 'presets', 'window'];
          var idx = 0;
          var interval = setInterval(function() {
            if (idx < fallbackMsgs.length) {
              setStatus(fallbackMsgs[idx]);
              // Advance bar
              var pct = ((idx + 1) / fallbackMsgs.length) * 100;
              if (barEl) barEl.style.width = pct + '%';
              idx++;
            } else {
              clearInterval(interval);
              setStatus('done');
              setTimeout(hideSplash, 600);
            }
          }, 1200);
        }

        // ── Expose hideSplash globally so React can call it ──────
        window.__hideSplash = hideSplash;
        window.__setSplashStatus = setStatus;
      })();
    </script>

    <!-- ═══ MAIN ENTRY POINT ═══ -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
