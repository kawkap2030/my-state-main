<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Self-hosted fonts (Lexend + Source Sans 3) — bundled locally in /fonts for
         fully offline operation. No network dependency; loads in milliseconds from
         disk, so a plain stylesheet link is both simple and reliably applied. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>منظومة إحصائيات الأدوية والمستلزمات الطبية</title>
    <style>
      /* ════════════════════════════════════════════════════════════════
         SPLASH SCREEN — Pure CSS, zero JS dependencies.
         Shown immediately, hidden by React once the app has mounted.
         ════════════════════════════════════════════════════════════════ */
      html, body {
        background: #0f172a;
        margin: 0;
        padding: 0;
        /* NOTE: overflow must NOT be hidden here — it blocked page scrolling
           across the whole app (only the fixed sidebar scrolled). The splash
           is position:fixed so it covers the viewport without needing this. */
        overflow: visible;
      }

      @keyframes splashParticleFloat {
        0%   { transform: translate(0, 0) scale(1); opacity: 0; }
        15%  { opacity: var(--p-opacity, 0.2); }
        85%  { opacity: var(--p-opacity, 0.2); }
        100% { transform: translate(var(--p-dx, 50px), var(--p-dy, -70px)) scale(0.8); opacity: 0; }
      }
      @keyframes splashPulseRing {
        0%, 100% { transform: scale(1); opacity: 0.4; box-shadow: 0 0 25px rgba(6, 182, 212, 0.3); }
        50%      { transform: scale(1.08); opacity: 0.7; box-shadow: 0 0 45px rgba(16, 185, 129, 0.45); }
      }
      @keyframes splashGlowText {
        0%, 100% { filter: drop-shadow(0 0 12px rgba(6, 182, 212, 0.3)); }
        50%      { filter: drop-shadow(0 0 25px rgba(52, 211, 153, 0.5)); }
      }
      @keyframes splashExit {
        0%   { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(0.98); }
      }

      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0c1929 0%, #0f172a 30%, #1a2332 70%, #0f172a 100%);
        transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1), transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, Cairo, Arial, sans-serif;
        direction: rtl;
        overflow: hidden; /* clip floating particles inside the splash */
        user-select: none;
      }

      /* Animated gradient overlay — matches LoginPage backdrop */
      .splash-bg-gradient {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #0891b2 0%, #0e7490 25%, #7c3aed 50%, #059669 75%, #0891b2 100%);
        background-size: 200% 200%;
        animation: splashGradientShift 8s ease infinite;
        opacity: 0.18;
        pointer-events: none;
        z-index: 0;
      }
      @keyframes splashGradientShift {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      /* Particles */
      .splash-particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
        /* NOTE: overflow must NOT be hidden here — it blocked page scrolling
           across the whole app (only the fixed sidebar scrolled). The splash
           is position:fixed so it covers the viewport without needing this. */
        overflow: visible;
        z-index: 0;
      }
      .splash-particle {
        position: absolute;
        border-radius: 50%;
        background: rgba(6, 182, 212, 0.15);
        animation: splashParticleFloat var(--p-dur, 16s) ease-in-out infinite;
        animation-delay: var(--p-delay, 0s);
        animation-fill-mode: both;
      }

      /* Logo Wrapper */
      .splash-logo-container {
        position: relative;
        margin-bottom: 20px;
        z-index: 1;
      }
      .splash-logo-ring {
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(6, 182, 212, 0.5), rgba(16, 185, 129, 0.5));
        animation: splashPulseRing 3s ease-in-out infinite;
        filter: blur(8px);
      }
      .splash-logo {
        position: relative;
        width: 86px;
        height: 86px;
        border-radius: 50%;
        background: #ffffff;
        padding: 10px;
        object-fit: contain;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 20px rgba(6, 182, 212, 0.3);
        border: 2px solid rgba(255, 255, 255, 0.8);
      }

      /* Title & Branding */
      .splash-content {
        text-align: center;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .splash-title {
        font-size: 30px;
        font-weight: 900;
        background: linear-gradient(135deg, #ffffff 30%, #38bdf8 70%, #34d399 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: splashGlowText 3s ease-in-out infinite;
        margin: 0 0 6px 0;
        letter-spacing: 0.5px;
      }
      .splash-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 14px;
        border-radius: 99px;
        background: rgba(6, 182, 212, 0.1);
        border: 1px solid rgba(6, 182, 212, 0.25);
        color: #38bdf8;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 28px;
      }

      /* Loading Bar Container */
      .splash-bar-wrapper {
        width: 320px;
        position: relative;
        z-index: 1;
      }
      .splash-bar-track {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 99px;
        /* NOTE: overflow must NOT be hidden here — it blocked page scrolling
           across the whole app (only the fixed sidebar scrolled). The splash
           is position:fixed so it covers the viewport without needing this. */
        overflow: visible;
        margin-bottom: 12px;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
      }
      .splash-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #06b6d4 0%, #0891b2 50%, #10b981 100%);
        border-radius: 99px;
        transition: width 0.35s ease-out;
        box-shadow: 0 0 12px rgba(6, 182, 212, 0.6);
      }
      .splash-bar-fill.complete {
        background: linear-gradient(90deg, #10b981, #059669);
        box-shadow: 0 0 16px rgba(16, 185, 129, 0.8);
      }

      /* Status Row */
      .splash-status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        font-size: 11px;
        font-weight: 700;
        color: #94a3b8;
      }
      .splash-status-text {
        color: #cbd5e1;
        transition: opacity 0.2s ease;
      }
      .splash-pct-text {
        color: #38bdf8;
        font-family: monospace;
        font-size: 12px;
      }

      /* Exit Animation Class */
      #splash-screen.hidden {
        animation: splashExit 0.25s ease-out forwards;
        pointer-events: none;
      }

      /* Footer */
      .splash-footer {
        position: fixed;
        bottom: 22px;
        font-size: 11px;
        font-weight: 600;
        color: #475569;
        text-align: center;
        line-height: 1.6;
        z-index: 1;
      }
      .splash-footer strong {
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <!-- ═══ SPLASH SCREEN ═══ -->
    <div id="splash-screen">
      <div class="splash-bg-gradient"></div>
      <div class="splash-particles" id="splash-particles"></div>

      <div class="splash-logo-container">
        <div class="splash-logo-ring"></div>
        <img src="/logo.png" alt="منظومة إحصائيات الأدوية والمستلزمات الطبية" class="splash-logo" />
      </div>

      <div class="splash-content">
        <h1 class="splash-title">منظومة إحصائيات الأدوية والمستلزمات الطبية</h1>
        <div class="splash-badge">
          <span>الهيئة العامة للتأمين الصحي</span>
        </div>
      </div>

      <div class="splash-bar-wrapper">
        <div class="splash-bar-track">
          <div class="splash-bar-fill" id="splash-bar"></div>
        </div>
        <div class="splash-status-row">
          <span class="splash-status-text" id="splash-status">جاري التهيئة...</span>
          <span class="splash-pct-text" id="splash-pct">0%</span>
        </div>
      </div>

      <div class="splash-footer">
        تصميم وإعداد وتطوير <strong>ك/ أحمد علي أحمد كوكب</strong><br />
        جميع الحقوق محفوظة © 2026
      </div>
    </div>

    <!-- ═══ REACT ROOT ═══ -->
    <div id="root"></div>

    <!-- ═══ Tauri Event Listener & Splash Controller ═══ -->
    <!-- ═══ Tauri Event Listener & Splash Controller ═══ -->
    <script>
      (function() {
        var statusEl = document.getElementById('splash-status');
        var barEl    = document.getElementById('splash-bar');
        var pctEl    = document.getElementById('splash-pct');

        var statuses = {
          'init-db':     { msg: 'جاري تهيئة قاعدة البيانات...',          pct: 25 },
          'schema':      { msg: 'تطبيق هيكل البيانات...',                pct: 50 },
          'migrations':  { msg: 'تحديث جداول الأدوية والمصروفات...',        pct: 70 },
          'signatures':  { msg: 'تجهيز التوقيعات الرقمية للتقارير...',    pct: 85 },
          'presets':     { msg: 'تحميل الإعدادات الحسابات...',           pct: 92 },
          'window':      { msg: 'تجهيز واجهة المستخدم...',              pct: 98 },
          'done':        { msg: 'تم التحميل بنجاح ✓',                    pct: 100 },
        };

        var maxPct = 0;
        var isHidden = false;

        function setProgress(pct, msg) {
          if (pct > maxPct) maxPct = pct;
          if (barEl) {
            barEl.style.width = maxPct + '%';
            if (maxPct >= 100) barEl.classList.add('complete');
          }
          if (pctEl) {
            pctEl.textContent = maxPct + '%';
          }
          if (statusEl && msg) {
            statusEl.textContent = msg;
          }
        }

        function setStatus(key) {
          var entry = statuses[key] || { msg: key, pct: maxPct };
          setProgress(entry.pct, entry.msg);
        }

        function hideSplash() {
          if (isHidden) return;
          isHidden = true;
          var splash = document.getElementById('splash-screen');
          if (splash) {
            splash.style.transition = 'opacity 0.35s ease-out, transform 0.35s ease-out';
            splash.style.opacity = '0';
            splash.style.transform = 'scale(0.98)';
            splash.style.pointerEvents = 'none';
            setTimeout(function() {
              if (splash.parentNode) splash.parentNode.removeChild(splash);
            }, 380);
          }
        }

        var reactMounted = false;
        var backendReady = false;

        function maybeHideSplash() {
          if (reactMounted && backendReady) {
            setProgress(100, 'تم التحميل بنجاح ✓');
            setTimeout(hideSplash, 250);
          }
        }

        // ── Smooth progressive loading simulation ──────────────────
        // Ensures splash stays visible for ~1.6s with smooth progress bar
        setProgress(20, 'جاري تهيئة النظام وقاعدة البيانات...');
        setTimeout(function() { setProgress(45, 'تطبيق هيكل البيانات والشاشات...'); }, 400);
        setTimeout(function() { setProgress(75, 'تحميل الحسابات والتوقيعات الرقمية...'); }, 850);
        setTimeout(function() { setProgress(95, 'تجهيز واجهة المستخدم وشاشة الدخول...'); }, 1300);

        // ── Tauri Event Listener & Handshake ────────────────
        // Tauri v2 does NOT expose `window.__TAURI_INTERNALS__.event`
        // (that's a v1/withGlobalTauri API). Real listeners are registered via
        // the event plugin's IPC command `plugin:event|listen` — exactly what
        // `@tauri-apps/api/event`'s listen() does under the hood. We then send
        // a `splash_listener_ready` handshake so the backend only emits
        // 'splash:complete' once a real JS listener exists (Tauri 2.10.x drops
        // events for webviews with no registered listener — no buffering).
        var isTauri = typeof window !== 'undefined' && (window.__TAURI_INTERNALS__ || window.__TAURI__);

        if (isTauri) {
          try {
            var internals = window.__TAURI_INTERNALS__;
            if (internals && internals.invoke && internals.transformCallback) {
              var listenP = internals.invoke('plugin:event|listen', {
                event: 'splash:progress',
                target: { kind: 'Any' },
                handler: internals.transformCallback(function(e) {
                  var payload = e.payload;
                  if (typeof payload === 'string') setStatus(payload);
                  else if (payload && payload.message) setStatus(payload.message);
                })
              });
              var completeP = internals.invoke('plugin:event|listen', {
                event: 'splash:complete',
                target: { kind: 'Any' },
                handler: internals.transformCallback(function() {
                  backendReady = true;
                  maybeHideSplash();
                })
              });
              // Handshake: once BOTH listeners are registered on the Rust side,
              // tell the backend so it can emit 'done' + 'splash:complete'.
              Promise.all([listenP, completeP])
                .then(function() {
                  return internals.invoke('splash_listener_ready');
                })
                .catch(function() {});
            }

            var winAPI = (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.window) ||
                         (window.__TAURI__ && window.__TAURI__.window);
            if (winAPI && winAPI.getCurrentWindow) {
              winAPI.getCurrentWindow().show();
            }
          } catch(e) {}
        }

        // ── Particles Generator ───────────────────────────
        (function() {
          var container = document.getElementById('splash-particles');
          if (!container) return;
          var colors = ['rgba(6,182,212,0.18)', 'rgba(16,185,129,0.15)', 'rgba(56,189,248,0.15)', 'rgba(124,58,237,0.14)'];
          for (var i = 0; i < 20; i++) {
            var p = document.createElement('div');
            p.className = 'splash-particle';
            var size = 5 + Math.random() * 14;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = Math.random() * 100 + '%';
            p.style.top = Math.random() * 100 + '%';
            p.style.setProperty('--p-dur', (12 + Math.random() * 14) + 's');
            p.style.setProperty('--p-delay', (Math.random() * 6) + 's');
            p.style.setProperty('--p-opacity', (0.1 + Math.random() * 0.15).toString());
            p.style.setProperty('--p-dx', (-30 + Math.random() * 60) + 'px');
            p.style.setProperty('--p-dy', (-40 + Math.random() * 40) + 'px');
            p.style.background = colors[Math.floor(Math.random() * colors.length)];
            container.appendChild(p);
          }
        })();

        // Coordination fallback trigger after progress reaches 100% (~1.6s).
        // UI-side safety net only: it may mark React as ready, but it must
        // NOT declare the backend ready. backendReady becomes true solely via
        // the real 'splash:complete' event from Rust (or in browser mode,
        // where there is no Rust backend to wait for).
        setTimeout(function() {
          reactMounted = true;
          if (!isTauri) backendReady = true;
          maybeHideSplash();
        }, 1650);

        // Global functions exposed to React
        window.__hideSplash = hideSplash;
        window.__setSplashStatus = setStatus;
        window.__markReactReady = function() {
          reactMounted = true;
          maybeHideSplash();
        };
        window.__markBackendDone = function() {
          backendReady = true;
          maybeHideSplash();
        };
      })();
    </script>

    <!-- ═══ MAIN ENTRY POINT ═══ -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
