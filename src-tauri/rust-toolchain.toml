# PROJECT DEPENDS ON STABLE RUST 1.97.1 (verified) on x86_64-pc-windows-msvc.
# This file forces the stable toolchain for the whole project.
#
# VERIFIED (actual tests, August 2026):
#   - rustc 1.97.1
#   - cargo 1.97.1
#   - cargo +stable check --no-default-features --offline  -> EXIT 0
#   - cargo build                                          -> success
#   - cargo build --release                                 -> success
#   - Tauri release build produced: target\release\drug-stats.exe
#
# The previous Nightly pin (nightly-2026-08-08) was only required because
# old stable toolchains crashed with compiler ICE / STATUS_HEAP_CORRUPTION /
# STATUS_ACCESS_VIOLATION / STATUS_STACK_BUFFER_OVERRUN while compiling
# zerocopy / webview2-com-sys during development. Those issues are resolved
# with stable 1.97.1. Nightly is NOT required anymore and is NOT "better".
#
# The historical Nightly configuration is preserved in:
#   rust-toolchain.toml.backup  (do not delete)
[toolchain]
channel = "1.97.1"
profile = "minimal"
