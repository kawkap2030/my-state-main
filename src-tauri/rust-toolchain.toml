# Force the nightly toolchain for this project.
# WHY: stable rustc 1.97.1 crashes with STATUS_ACCESS_VIOLATION (0xc0000005)
# during codegen while compiling zerocopy's SIMD code on Windows x86_64-msvc.
# Nightly 1.99.0 (2026-08-08) successfully builds the project,
# including webview2-com-sys 0.38.2.
# Nightly 2026-08-09 causes STATUS_STACK_BUFFER_OVERRUN (0xc0000409)
# while compiling webview2-com-sys 0.38.2.
# Pinned to a DATE so a future nightly regression cannot break the build.
# See AGENTS.md for details.
[toolchain]
channel = "nightly-2026-08-08"
profile = "minimal"